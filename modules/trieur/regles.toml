# Les règles de reconnaissance du Trieur (§5), lues à chaque démarrage.
#
# Chaque type a des indices : une expression cherchée dans le texte mis à plat (minuscules, sans accents) et un
# poids. Un indice compte une fois. « haut = true » : seulement dans le haut du document (le titre), ailleurs il
# compte pour moitié. Un poids négatif éloigne le type (« devis » sur une facture).
# Le type gagnant est celui qui a le plus de points ; la confiance dépend de son avance sur le deuxième.
# Les catégories d'émetteurs (emetteurs.json) ajoutent des points : un relevé vient d'une banque.
#
# Pour ajouter un indice : une ligne { re = '…', poids = 3 }, puis `python trieur.py doctor` vérifie le fichier.

[reglages]
lignes_haut = 14          # le « haut » du document : ses 14 premières lignes non vides
confiance_echelle = 4.0   # l'avance (en points) qui donne une confiance de 63 % ; 2 × → 86 %, 3 × → 95 %
score_plein = 7.0         # en dessous, la confiance baisse en proportion (peu d'indices = peu sûr)
score_min = 4.0           # en dessous, le document est « autre »

[categories]  # catégorie de l'émetteur → points ajoutés aux types
commerce = { facture_achat = 2.0, ticket_caisse = 1.5, garantie_notice = 1.0 }
ecommerce = { facture_achat = 3.0 }
supermarche = { ticket_caisse = 3.0 }
energie = { facture_service = 3.0 }
telecom = { facture_service = 3.0 }
abonnement = { facture_service = 3.0 }
banque = { releve_bancaire = 3.0 }
impots = { avis_imposition = 4.0 }
social = { attestation = 1.0, courrier_admin = 1.5 }
sante = { sante = 3.0 }
assurance = { assurance = 2.5, attestation = 0.5 }
transport = { billet_transport = 3.0 }
hebergement = { reservation = 3.0 }
immobilier = { quittance_loyer = 1.5, bail_contrat = 1.5 }
administration = { courrier_admin = 1.0, identite = 1.0 }
marque = { garantie_notice = 2.0 }

