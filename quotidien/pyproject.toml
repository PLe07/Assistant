[project]
name = "quotidien"
version = "1.0.0"
description = "Quotidien : météo « habille-toi », menu de la semaine, vide-frigo et anniversaires, en un brief matinal."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.0,<2",       # photo du frigo, message d'anniversaire, envie libre (seulement quand le local ne suffit pas)
  "pydantic>=2.6,<3",        # schéma des réponses de l'IA
  "Pillow>=10.1,<13",        # photo du frigo : réduite à 1 024 px, métadonnées retirées avant l'envoi
  "pillow-heif>=0.16,<2",    # photos HEIC de l'iPhone
  "pyobjc-framework-Contacts>=10 ; sys_platform == 'darwin'",  # anniversaires des Contacts, en lecture seule
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "hypothesis>=6.100"]

[project.scripts]
quotidien = "quotidien.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quotidien*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.toml", "*.html", "*.css"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S102", "S307"]

[tool.ruff.lint.per-file-ignores]
# Des tables de données (une formulation ou un scénario par ligne) : les couper les rendrait illisibles.
"tests/frigo/donnees_*.py" = ["E501"]
"tests/meteo/table_*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["^\\.venv/", "^tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "reel: appel réel (IA, Open-Meteo, Rappels, iCloud) : lancé seulement avec -m reel, quand l'accès existe",
]
addopts = "-m 'not reel' -p no:cacheprovider"

[tool.coverage.run]
source = ["quotidien"]
branch = false
# Seuls les appels natifs du Mac (pyobjc Contacts) sont exclus : vérifiés par tests/e2e_mac sur le Mac.
omit = ["quotidien/anniversaires/contacts_natif.py", "quotidien/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
